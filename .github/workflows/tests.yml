name: Проверки

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Europe/Moscow
      PYTHON: python
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Модули питона
        run: python -m pip install -r requirements-dev.txt

      - name: Playwright и Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Пересборка страниц без сети
        run: python rebuild_pages.py --offline

      - name: Проверки безопасности сборки
        run: python tests/test_safety.py

      - name: Все проверки сайта
        run: node tests/run.js
