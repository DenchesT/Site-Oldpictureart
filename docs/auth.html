</head><body class="error-page">
<main class="error-box">
  <h1 id="auth-status">Входим…</h1>
  <p class="error-text" id="auth-msg" role="status">Минуту — сверяемся с Яндексом или VK.</p>
  <p><a class="random-btn" id="auth-back" href="./">Вернуться на сайт</a></p>
</main>
<script>
var CLOUD = {api: 'https://functions.yandexcloud.net/d4e2jv2t457u5oldt269', yandex: '7a85cd4ed113494c82722380127c35f1', vk: '54785333',
             redirect: 'https://oldpictureart.ru/auth.html', vkHost: 'https://id.vk.ru'};
CLOUD.on = !!(CLOUD.api && (CLOUD.yandex || CLOUD.vk));

function readLocalLikes() {
  try { return JSON.parse(localStorage.getItem('likes') || '{}') || {}; } catch (e) { return {}; }
}
function writeLocalLikes(map) {
  try { localStorage.setItem('likes', JSON.stringify(map)); } catch (e) {}
}

// OPA MOBILE & EXHIBITION FAVORITES 2026-10-31: cloud keys are independent
// from painting IDs, but reuse the already deployed YDB likes table/API.
function readAfishaFavorites() {
  try {
    var v = JSON.parse(localStorage.getItem('afishaFavorites') || '{}');
    return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  } catch (e) { return {}; }
}
function writeAfishaFavorites(v) {
  try { localStorage.setItem('afishaFavorites', JSON.stringify(v)); } catch (e) {}
}
function readAfishaFavoritePending() {
  try {
    var v = JSON.parse(localStorage.getItem('afishaFavoritesPending') || '{}');
    return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  } catch (e) { return {}; }
}
function writeAfishaFavoritePending(v) {
  try {
    if (Object.keys(v).length) localStorage.setItem('afishaFavoritesPending', JSON.stringify(v));
    else localStorage.removeItem('afishaFavoritesPending');
  } catch (e) {}
}
function announceAfishaFavorites() {
  window.dispatchEvent(new Event('opa:afisha-favorites'));
}
function afishaAccountKey() {
  var s = getSession();
  if (!s || !s.token) return '';
  try {
    var raw = s.token.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
    var data = JSON.parse(atob(raw));
    return typeof data.u === 'string' ? data.u : '';
  } catch (e) { return ''; }
}
var _afishaFavQueue = Promise.resolve(), _afishaFavChanges = 0;
function syncAfishaFavorites() {
  if (!CLOUD.on || !getSession() || !window.OPA_AFISHA_CATALOG) return Promise.resolve(false);
  // Serialize updates so two rapid star clicks cannot reorder requests.
  var job = _afishaFavQueue.catch(function () { return false; }).then(function () {
    if (!getSession()) return false;
    var who = afishaAccountKey();
    if (!who) return false;
    var catalog = window.OPA_AFISHA_CATALOG;
    var version = _afishaFavChanges;
    var saved = readAfishaFavorites(), pending = readAfishaFavoritePending();
    var former = '';
    try { former = localStorage.getItem('afishaFavoritesAccount') || ''; } catch (e) {}
    // Do not silently upload one signed-in user's favorites to a different account.
    if (former && former !== who) {
      saved = {}; pending = {};
      writeAfishaFavorites(saved); writeAfishaFavoritePending(pending);
      announceAfishaFavorites();
    }
    var merging = former !== who;
    var up = [], down = [];
    Object.keys(catalog).forEach(function (id) {
      var cloudId = catalog[id].key;
      if (!cloudId) return;
      if (Object.prototype.hasOwnProperty.call(pending, id)) {
        (pending[id] ? up : down).push(cloudId);
      } else if (merging && saved[id]) {
        up.push(cloudId);
      }
    });
    return Promise.all(down.map(function (key) { return cloudCall('unlike', {post_id: key}); }))
      .then(function () { return cloudCall('sync', {likes: up}); })
      .then(function (answer) {
        var remote = new Set(answer.likes || []), refreshed = {};
        Object.keys(catalog).forEach(function (id) {
          if (remote.has(catalog[id].key)) refreshed[id] = true;
        });
        try { localStorage.setItem('afishaFavoritesAccount', who); } catch (e) {}
        // A click during the request remains pending for the next queued sync.
        if (_afishaFavChanges === version) {
          writeAfishaFavorites(refreshed);
          writeAfishaFavoritePending({});
          announceAfishaFavorites();
        }
        return true;
      }).catch(function (e) {
        console.warn('Избранные выставки: синхронизация недоступна:', e.message);
        return false; // keep pending changes on network failures
      });
  });
  _afishaFavQueue = job;
  return job;
}
function setAfishaFavorite(id, liked) {
  var catalog = window.OPA_AFISHA_CATALOG || {};
  if (!Object.prototype.hasOwnProperty.call(catalog, id)) return;
  var saved = readAfishaFavorites(), pending = readAfishaFavoritePending();
  if (liked) saved[id] = true; else delete saved[id];
  pending[id] = !!liked;
  _afishaFavChanges++;
  writeAfishaFavorites(saved);
  writeAfishaFavoritePending(pending);
  announceAfishaFavorites();
  if (CLOUD.on && getSession()) syncAfishaFavorites();
}

// Пропуск от функции: {token, name, provider, exp}. Сам токен подписан
// на сервере, подделать его в браузере нельзя; здесь он только хранится.
function getSession() {
  try {
    var s = JSON.parse(localStorage.getItem('session') || 'null');
    if (s && s.token && s.exp * 1000 > Date.now()) return s;
  } catch (e) {}
  return null;
}
function setSession(s) {
  try {
    if (s) localStorage.setItem('session', JSON.stringify(s));
    else { localStorage.removeItem('session'); localStorage.removeItem('likes-synced'); }
  } catch (e) {}
}

// Все запросы — POST с Content-Type text/plain: так браузер не шлёт перед
// каждым предварительный OPTIONS-запрос, и функции не нужно его ждать.
function cloudCall(action, data) {
  var body = {action: action}, k, s = getSession();
  for (k in (data || {})) body[k] = data[k];
  if (s && action !== 'login') body.token = s.token;
  return fetch(CLOUD.api, {method: 'POST', body: JSON.stringify(body),
                           headers: {'Content-Type': 'text/plain;charset=UTF-8'}})
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401) setSession(null);       // пропуск истёк — выходим
        if (!r.ok) { var e = new Error(j.error || ('Ошибка ' + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
}

// Отметки, которые не удалось отправить (не было сети), — отправим позже.
function readPending() {
  try { return JSON.parse(localStorage.getItem('likes-pending') || '{}') || {}; } catch (e) { return {}; }
}
function writePending(map) {
  try {
    if (Object.keys(map).length) localStorage.setItem('likes-pending', JSON.stringify(map));
    else localStorage.removeItem('likes-pending');
  } catch (e) {}
}

// Свести отметки браузера и облака.
//   merge — сразу после входа: всё, что отмечено в браузере, уходит в облако.
//   иначе — облако главное: снятая на телефоне отметка снимается и здесь.
//     Не чаще раза в пять минут, чтобы не дёргать функцию на каждой странице.
// Возвращает true, если список в браузере обновился.
function cloudSync(mode) {
  if (!CLOUD.on || !getSession()) return Promise.resolve(false);
  var last = 0;
  try { last = +localStorage.getItem('likes-synced') || 0; } catch (e) {}
  if (mode !== 'merge' && mode !== 'force' && Date.now() - last < 5 * 60 * 1000) return Promise.resolve(false);
  var local = readLocalLikes(), pending = readPending(), k, up = [], down = [];
  for (k in (mode === 'merge' ? local : {})) if (local[k]) up.push(k);
  for (k in pending) (pending[k] ? up : down).push(k);
  return Promise.all(down.map(function (id) { return cloudCall('unlike', {post_id: id}); }))
    .then(function () { return cloudCall('sync', {likes: up}); })
    .then(function (j) {
      var merged = {};
      (j.likes || []).forEach(function (id) { if (String(id).indexOf('exh_') !== 0) merged[id] = true; });
      writeLocalLikes(merged);
      writePending({});
      try { localStorage.setItem('likes-synced', String(Date.now())); } catch (e) {}
      return true;
    })
    .catch(function (e) { console.warn('Избранное из облака недоступно:', e.message); return false; });
}
</script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var flow = null;
  try { flow = JSON.parse(sessionStorage.getItem('auth-flow') || 'null'); sessionStorage.removeItem('auth-flow'); } catch (e) {}
  // Вернуть можно только на свой же сайт — чужой адрес в back не пройдёт.
  var back = './';
  try { if (flow && flow.back && new URL(flow.back).origin === location.origin) back = flow.back; } catch (e) {}
  document.getElementById('auth-back').href = back;

  function fail(text) {
    document.getElementById('auth-status').textContent = 'Войти не получилось';
    document.getElementById('auth-msg').textContent = text;
  }
  if (!CLOUD.on) return fail('Вход на сайте сейчас выключен.');
  if (q.get('error')) {
    return fail(q.get('error') === 'access_denied' ? 'Вход отменён.'
                : 'Ответ сервиса входа: ' + (q.get('error_description') || q.get('error')));
  }
  if (!flow || !q.get('code') || q.get('state') !== flow.state) {
    return fail('Не удалось проверить, что это ваш вход. Попробуйте войти ещё раз.');
  }
  var data = {provider: flow.provider, code: q.get('code'), state: q.get('state')};
  if (flow.provider === 'vk') { data.code_verifier = flow.verifier; data.device_id = q.get('device_id'); }
  cloudCall('login', data)
    .then(function (j) {
      setSession({token: j.token, name: j.name, provider: j.provider, exp: j.exp});
      return cloudSync('merge');
    })
    .then(function () {
      try { sessionStorage.setItem('auth-greet', '1'); } catch (e) {}
      location.replace(back);
    })
    .catch(function (e) { fail(e.message || 'Сервер не ответил. Попробуйте позже.'); });
})();
</script>
